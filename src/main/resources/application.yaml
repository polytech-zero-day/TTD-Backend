spring:
  application:
    name: ttd

  datasource:
    url: jdbc:h2:mem:ttd;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}  # 운영 배포 시 false로 (콘솔 노출·무인증 차단)
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${AI_MODEL:gpt-5.4-mini}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  security:
    aes-key: ${AES_SECRET_KEY}
    hmac-key: ${HMAC_SECRET_KEY}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 14
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin-init:
    email: ${ADMIN_INIT_EMAIL:admin@ttd.local}
    password: ${ADMIN_INIT_PASSWORD:admin1234!}
    nickname: ${ADMIN_INIT_NICKNAME:admin}
  rabbitmq:
    exchange: ttd.sandbox.exchange
    queue:
      execution: sandbox.execution.q
      execution-retry: sandbox.execution.retry.q
      execution-dlq: sandbox.execution.dlq
      result: sandbox.result.q
      grading: grading.q     # 기존 exchange(ttd.sandbox.exchange) 재사용
    routing-key:
      execution-request: execution.request
      execution-result: execution.result
      grading: grading.request
    retry:
      max-attempts: 3
      initial-interval-ms: 5000
      multiplier: 2.0
  attempt:
    time-limit-minutes: 45
    message-limit: 10
  ai:
    cache-ttl-hours: 24
    # 관리자 모델 설정에서 선택 가능한 모델 목록 (PUT 검증 + 프론트 셀렉트 원천)
    available-models: ${AI_AVAILABLE_MODELS:gpt-5.4-mini,gpt-5.4,gpt-5.4-nano}
    # 유료(PAID) 구독자가 응시(CHAT) 시 사용하는 상위 모델. FREE는 CHAT 용도 설정값(기본 gpt-5.4-mini)을 쓴다.
    premium-chat-model: ${AI_PREMIUM_CHAT_MODEL:gpt-5.4}
  portone:
    store-id: ${PORTONE_STORE_ID}
    api-secret: ${PORTONE_API_SECRET}
    channel-key: ${PORTONE_CHANNEL_KEY}
    billing-cron: ${PORTONE_BILLING_CRON:0 0 3 * * *}
  payment:
    monthly-price-krw: 9900
    order-name: TTD 월간 구독
    # 데모 결제 승인 모드(설계서 S-13). true면 프론트가 보낸 데모 빌링키(demo-*/mock-*)만
    # PG 실호출 없이 성공 처리한다(F117 미가맹점 우회). 실제 발급된 빌링키는 그대로 PortOne로 간다.
    # 운영 전환(실가맹점) 시 false로 두면 모든 결제가 실제 PG를 탄다.
    mock-enabled: ${PAYMENT_MOCK_ENABLED:true}
