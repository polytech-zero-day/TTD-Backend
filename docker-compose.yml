name: TDD-Util

services:
  redis:
    image: redis:7-alpine
    container_name: tdd-util-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tdd-util-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
