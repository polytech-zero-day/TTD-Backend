openapi: 3.1.0
info:
  title: TTD API
  description: 코딩테스트 문제풀이 + AI 코드 해설 SaaS API 문서
  version: v0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/auth/signup:
    post:
      tags:
      - auth-controller
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
  /api/auth/refresh:
    post:
      tags:
      - auth-controller
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTokenResponse"
  /api/auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
  /api/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTokenResponse"
  /api/admin/users:
    get:
      tags:
      - admin-user-controller
      operationId: getUsers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListUserResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - admin-user-controller
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
      security:
      - bearerAuth: []
  /api/admin/users/{id}:
    get:
      tags:
      - admin-user-controller
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - admin-user-controller
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
    patch:
      tags:
      - admin-user-controller
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
      security:
      - bearerAuth: []
  /api/admin/problems:
    get:
      tags:
      - admin-problem-controller
      operationId: getProblems_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListAdminProblemResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - admin-problem-controller
      operationId: createProblem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemCreateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminProblemResponse"
      security:
      - bearerAuth: []
  /api/admin/problems/{id}:
    get:
      tags:
      - admin-problem-controller
      operationId: getProblem_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminProblemResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - admin-problem-controller
      operationId: updateProblem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminProblemResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - admin-problem-controller
      operationId: deleteProblem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
  /api/admin/problems/{id}/status:
    patch:
      tags:
      - admin-problem-controller
      operationId: changeStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemStatusUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminProblemResponse"
      security:
      - bearerAuth: []
  /api/problems:
    get:
      tags:
      - problem-controller
      operationId: getProblems
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListProblemSummaryResponse"
      security:
      - bearerAuth: []
  /api/problems/{id}:
    get:
      tags:
      - problem-controller
      operationId: getProblem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProblemResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 64
          minLength: 8
        nickname:
          type: string
          maxLength: 30
          minLength: 0
      required:
      - email
      - nickname
      - password
    ApiResponseUserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/UserResponse"
        errorCode:
          type: string
        message:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum:
          - USER
          - ADMIN
        createdAt:
          type: string
          format: date-time
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    ApiResponseTokenResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/TokenResponse"
        errorCode:
          type: string
        message:
          type: string
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    UserCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 64
          minLength: 8
        nickname:
          type: string
          maxLength: 30
          minLength: 0
        role:
          type: string
          enum:
          - USER
          - ADMIN
      required:
      - email
      - nickname
      - password
      - role
    UserUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 30
          minLength: 0
        role:
          type: string
          enum:
          - USER
          - ADMIN
      required:
      - nickname
      - role
    ApiResponseListUserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        errorCode:
          type: string
        message:
          type: string
    ProblemCreateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
        difficulty:
          type: string
          enum:
          - L1
          - L2
        type:
          type: string
          enum:
          - CLASSIFY
          - CONSTRAINT
          - ANALYSIS_BASIC
          - ANALYSIS_ADV
          - AMBIGUOUS
          - REPORT
          - SKELETON_STAT
          - SKELETON_HTTP
          - SKELETON_LOG
          - SKELETON_RESERVE
        sourceType:
          type: string
          enum:
          - AUTO_GRADED
          - RUBRIC_ONLY
        description:
          type: string
          minLength: 1
        requirements:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        constraints:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        skeletonCode:
          type: string
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
      required:
      - constraints
      - description
      - difficulty
      - requirements
      - sourceType
      - title
      - type
    AdminProblemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        difficulty:
          type: string
          enum:
          - L1
          - L2
        type:
          type: string
          enum:
          - CLASSIFY
          - CONSTRAINT
          - ANALYSIS_BASIC
          - ANALYSIS_ADV
          - AMBIGUOUS
          - REPORT
          - SKELETON_STAT
          - SKELETON_HTTP
          - SKELETON_LOG
          - SKELETON_RESERVE
        maxAttempts:
          type: integer
          format: int32
        sourceType:
          type: string
          enum:
          - AUTO_GRADED
          - RUBRIC_ONLY
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        constraints:
          type: array
          items:
            type: string
        skeletonCode:
          type: string
        status:
          type: string
          enum:
          - draft
          - pending
          - active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiResponseAdminProblemResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/AdminProblemResponse"
        errorCode:
          type: string
        message:
          type: string
    ApiResponseListAdminProblemResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminProblemResponse"
        errorCode:
          type: string
        message:
          type: string
    ProblemUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
        difficulty:
          type: string
          enum:
          - L1
          - L2
        type:
          type: string
          enum:
          - CLASSIFY
          - CONSTRAINT
          - ANALYSIS_BASIC
          - ANALYSIS_ADV
          - AMBIGUOUS
          - REPORT
          - SKELETON_STAT
          - SKELETON_HTTP
          - SKELETON_LOG
          - SKELETON_RESERVE
        sourceType:
          type: string
          enum:
          - AUTO_GRADED
          - RUBRIC_ONLY
        description:
          type: string
          minLength: 1
        requirements:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        constraints:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        skeletonCode:
          type: string
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
      required:
      - constraints
      - description
      - difficulty
      - maxAttempts
      - requirements
      - sourceType
      - title
      - type
    ProblemStatusUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - draft
          - pending
          - active
      required:
      - status
    ProblemSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        difficulty:
          type: string
          enum:
          - L1
          - L2
        type:
          type: string
          enum:
          - CLASSIFY
          - CONSTRAINT
          - ANALYSIS_BASIC
          - ANALYSIS_ADV
          - AMBIGUOUS
          - REPORT
          - SKELETON_STAT
          - SKELETON_HTTP
          - SKELETON_LOG
          - SKELETON_RESERVE
        maxAttempts:
          type: integer
          format: int32
    ApiResponseListProblemSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProblemSummaryResponse"
        errorCode:
          type: string
        message:
          type: string
    ProblemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        difficulty:
          type: string
          enum:
          - L1
          - L2
        type:
          type: string
          enum:
          - CLASSIFY
          - CONSTRAINT
          - ANALYSIS_BASIC
          - ANALYSIS_ADV
          - AMBIGUOUS
          - REPORT
          - SKELETON_STAT
          - SKELETON_HTTP
          - SKELETON_LOG
          - SKELETON_RESERVE
        maxAttempts:
          type: integer
          format: int32
        sourceType:
          type: string
          enum:
          - AUTO_GRADED
          - RUBRIC_ONLY
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        constraints:
          type: array
          items:
            type: string
        skeletonCode:
          type: string
    ApiResponseProblemResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/ProblemResponse"
        errorCode:
          type: string
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
