openapi: 3.1.0
info:
  title: TTD API
  description: 코딩테스트 문제풀이 + AI 코드 해설 SaaS API 문서
  version: v0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/attempts/{id}/draft:
    put:
      tags:
      - attempt-controller
      operationId: updateDraft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
  /api/admin/problems/{id}:
    get:
      tags:
      - admin-problem-controller
      operationId: getProblem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminProblemResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - admin-problem-controller
      operationId: updateProblem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminProblemResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - admin-problem-controller
      operationId: deleteProblem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
  /api/auth/signup:
    post:
      tags:
      - auth-controller
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
  /api/auth/refresh:
    post:
      tags:
      - auth-controller
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTokenResponse"
  /api/auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
  /api/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTokenResponse"
  /api/attempts:
    post:
      tags:
      - attempt-controller
      operationId: start
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptStartRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAttemptSnapshotResponse"
      security:
      - bearerAuth: []
  /api/attempts/{id}/submit:
    post:
      tags:
      - attempt-controller
      operationId: submit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAttemptResultResponse"
      security:
      - bearerAuth: []
  /api/attempts/{id}/messages:
    post:
      tags:
      - attempt-controller
      operationId: sendMessage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptMessageRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAttemptMessageResponse"
      security:
      - bearerAuth: []
  /api/admin/users:
    get:
      tags:
      - admin-user-controller
      operationId: getUsers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListUserResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - admin-user-controller
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
      security:
      - bearerAuth: []
  /api/admin/problems:
    get:
      tags:
      - admin-problem-controller
      operationId: getProblems
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListAdminProblemResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - admin-problem-controller
      operationId: createProblem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemCreateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminProblemResponse"
      security:
      - bearerAuth: []
  /api/admin/users/{id}:
    get:
      tags:
      - admin-user-controller
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - admin-user-controller
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
    patch:
      tags:
      - admin-user-controller
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
      security:
      - bearerAuth: []
  /api/admin/problems/{id}/status:
    patch:
      tags:
      - admin-problem-controller
      operationId: changeStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemStatusUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAdminProblemResponse"
      security:
      - bearerAuth: []
  /api/problems:
    get:
      tags:
      - problem-controller
      operationId: getProblems_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListProblemSummaryResponse"
      security:
      - bearerAuth: []
  /api/problems/{id}:
    get:
      tags:
      - problem-controller
      operationId: getProblem_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProblemResponse"
      security:
      - bearerAuth: []
  /api/attempts/{id}/result:
    get:
      tags:
      - attempt-controller
      operationId: getResult
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAttemptResultResponse"
      security:
      - bearerAuth: []
  /api/attempts/current:
    get:
      tags:
      - attempt-controller
      operationId: getCurrent
      parameters:
      - name: problemId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAttemptSnapshotResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    DraftUpdateRequest:
      type: object
      properties:
        draft:
          type: string
    ProblemUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        difficulty:
          type: string
          enum:
          - L1
          - L2
        type:
          type: string
          enum:
          - CLASSIFY
          - CONSTRAINT
          - ANALYSIS_BASIC
          - ANALYSIS_ADV
          - AMBIGUOUS
          - REPORT
          - SKELETON_STAT
          - SKELETON_HTTP
          - SKELETON_LOG
          - SKELETON_RESERVE
        sourceType:
          type: string
          enum:
          - AUTO_GRADED
          - RUBRIC_ONLY
        description:
          type: string
          minLength: 1
        requirements:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        constraints:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        skeletonCode:
          type: string
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
      required:
      - constraints
      - description
      - difficulty
      - maxAttempts
      - requirements
      - sourceType
      - title
      - type
    AdminProblemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        difficulty:
          type: string
          enum:
          - L1
          - L2
        type:
          type: string
          enum:
          - CLASSIFY
          - CONSTRAINT
          - ANALYSIS_BASIC
          - ANALYSIS_ADV
          - AMBIGUOUS
          - REPORT
          - SKELETON_STAT
          - SKELETON_HTTP
          - SKELETON_LOG
          - SKELETON_RESERVE
        maxAttempts:
          type: integer
          format: int32
        sourceType:
          type: string
          enum:
          - AUTO_GRADED
          - RUBRIC_ONLY
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        constraints:
          type: array
          items:
            type: string
        skeletonCode:
          type: string
        status:
          type: string
          enum:
          - draft
          - pending
          - active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiResponseAdminProblemResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/AdminProblemResponse"
        errorCode:
          type: string
        message:
          type: string
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 64
          minLength: 8
        nickname:
          type: string
          maxLength: 30
          minLength: 0
      required:
      - email
      - nickname
      - password
    ApiResponseUserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/UserResponse"
        errorCode:
          type: string
        message:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum:
          - USER
          - ADMIN
        createdAt:
          type: string
          format: date-time
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    ApiResponseTokenResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/TokenResponse"
        errorCode:
          type: string
        message:
          type: string
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    AttemptStartRequest:
      type: object
      properties:
        problemId:
          type: integer
          format: int64
      required:
      - problemId
    ApiResponseAttemptSnapshotResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/AttemptSnapshotResponse"
        errorCode:
          type: string
        message:
          type: string
    AttemptSnapshotResponse:
      type: object
      properties:
        attemptId:
          type: integer
          format: int64
        status:
          type: string
        remainingSeconds:
          type: integer
          format: int64
        usage:
          $ref: "#/components/schemas/AttemptUsageResponse"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessageResponse"
        draft:
          type: string
    AttemptUsageResponse:
      type: object
      properties:
        messagesUsed:
          type: integer
          format: int32
        messagesLimit:
          type: integer
          format: int32
        tokensUsed:
          type: integer
          format: int64
        tokensBaseline:
          type: integer
          format: int64
    ChatMessageResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        role:
          type: string
        content:
          type: string
    ApiResponseAttemptResultResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/AttemptResultResponse"
        errorCode:
          type: string
        message:
          type: string
    AttemptResultResponse:
      type: object
      properties:
        attemptId:
          type: integer
          format: int64
        status:
          type: string
        rubricScore:
          type: integer
          format: int32
        efficiencyScore:
          type: integer
          format: int32
        feedback:
          type: string
    AttemptMessageRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required:
      - content
    ApiResponseAttemptMessageResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/AttemptMessageResponse"
        errorCode:
          type: string
        message:
          type: string
    AttemptMessageResponse:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/ChatMessageResponse"
        usage:
          $ref: "#/components/schemas/AttemptUsageResponse"
    UserCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 64
          minLength: 8
        nickname:
          type: string
          maxLength: 30
          minLength: 0
        role:
          type: string
          enum:
          - USER
          - ADMIN
      required:
      - email
      - nickname
      - password
      - role
    ProblemCreateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        difficulty:
          type: string
          enum:
          - L1
          - L2
        type:
          type: string
          enum:
          - CLASSIFY
          - CONSTRAINT
          - ANALYSIS_BASIC
          - ANALYSIS_ADV
          - AMBIGUOUS
          - REPORT
          - SKELETON_STAT
          - SKELETON_HTTP
          - SKELETON_LOG
          - SKELETON_RESERVE
        sourceType:
          type: string
          enum:
          - AUTO_GRADED
          - RUBRIC_ONLY
        description:
          type: string
          minLength: 1
        requirements:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        constraints:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        skeletonCode:
          type: string
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
      required:
      - constraints
      - description
      - difficulty
      - requirements
      - sourceType
      - title
      - type
    UserUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 30
          minLength: 0
        role:
          type: string
          enum:
          - USER
          - ADMIN
      required:
      - nickname
      - role
    ProblemStatusUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - draft
          - pending
          - active
      required:
      - status
    ApiResponseListProblemSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProblemSummaryResponse"
        errorCode:
          type: string
        message:
          type: string
    ProblemSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        difficulty:
          type: string
          enum:
          - L1
          - L2
        type:
          type: string
          enum:
          - CLASSIFY
          - CONSTRAINT
          - ANALYSIS_BASIC
          - ANALYSIS_ADV
          - AMBIGUOUS
          - REPORT
          - SKELETON_STAT
          - SKELETON_HTTP
          - SKELETON_LOG
          - SKELETON_RESERVE
        maxAttempts:
          type: integer
          format: int32
    ApiResponseProblemResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/ProblemResponse"
        errorCode:
          type: string
        message:
          type: string
    ProblemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        difficulty:
          type: string
          enum:
          - L1
          - L2
        type:
          type: string
          enum:
          - CLASSIFY
          - CONSTRAINT
          - ANALYSIS_BASIC
          - ANALYSIS_ADV
          - AMBIGUOUS
          - REPORT
          - SKELETON_STAT
          - SKELETON_HTTP
          - SKELETON_LOG
          - SKELETON_RESERVE
        maxAttempts:
          type: integer
          format: int32
        sourceType:
          type: string
          enum:
          - AUTO_GRADED
          - RUBRIC_ONLY
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        constraints:
          type: array
          items:
            type: string
        skeletonCode:
          type: string
    ApiResponseListUserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        errorCode:
          type: string
        message:
          type: string
    ApiResponseListAdminProblemResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminProblemResponse"
        errorCode:
          type: string
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
